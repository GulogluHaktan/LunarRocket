seed: 42

n_timesteps: !!float 1e6
policy: "MlpPolicy"
normalize_input: true
normalize_value: true
clip_obs: 10.0
n_steps: 32
batch_size: 8192
gae_lambda: 0.95
gamma: 0.99
n_epochs: 8
ent_coef: 0.005
learning_rate: !!float 3e-4
clip_range: !!float 0.2
policy_kwargs:
  activation_fn: "nn.ELU"
  net_arch: [128, 128]
  squash_output: false
vf_coef: 1.0
max_grad_norm: 1.0
device: "cuda:0"
