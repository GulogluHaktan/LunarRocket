# A2 algorithm-comparison arm (see the iniş yol haritası doc): DDPG alongside
# the tuned SAC config (sb3_sac_cfg.yaml), same net_arch/buffer/batch sizing
# so the comparison isolates the algorithm, not the capacity.
algo: "DDPG"
seed: 42

n_timesteps: !!float 5e6
steps_per_iteration: 32
policy: "MlpPolicy"
normalize_input: true
normalize_value: true
clip_obs: 10.0
buffer_size: 1000000
learning_starts: 16384
batch_size: 1024
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 32
# DDPG has no entropy-driven exploration like SAC -- Gaussian action noise is
# the exploration source. std is in the [-1, 1] normalized action units this
# env's actions live in (see LunarLanderEnv._pre_physics_step).
action_noise_std: 0.1
learning_rate: !!float 3e-4
policy_kwargs:
  activation_fn: "nn.ELU"
  net_arch: [384, 256, 128]
device: "cuda:0"
