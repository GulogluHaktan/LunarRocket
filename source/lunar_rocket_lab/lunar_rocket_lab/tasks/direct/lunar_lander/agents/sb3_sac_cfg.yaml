seed: 42

n_timesteps: !!float 5e6
steps_per_iteration: 32
policy: "MlpPolicy"
normalize_input: true
normalize_value: false
clip_obs: 10.0
buffer_size: 1000000
learning_starts: 16384
batch_size: 2048
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: "auto"
target_update_interval: 1
learning_rate: !!float 3e-4
policy_kwargs:
  activation_fn: "nn.ELU"
  net_arch: [384, 256, 128]
device: "cuda:0"
